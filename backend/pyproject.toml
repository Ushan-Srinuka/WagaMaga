[project]
name = "wagamaga-backend"
version = "0.1.0"
description = "WagaMaga AI API and worker foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20,<2",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.3,<3.4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest-cache"
addopts = "-ra --strict-markers"
markers = ["integration: requires the dedicated PostgreSQL/pgvector test database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
