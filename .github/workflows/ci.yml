name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Python lint and formatting
        run: |
          uv run ruff check . ../scripts/configure_local.py --config pyproject.toml
          uv run ruff format --check . ../scripts/configure_local.py --config pyproject.toml
      - name: Create disposable local configuration
        run: uv run python ../scripts/configure_local.py --port 55432
      - name: Start PostgreSQL with pgvector
        working-directory: .
        run: docker compose up -d --wait
      - name: Apply application migrations
        run: uv run alembic upgrade head
      - name: Test rules, API and real PostgreSQL permissions
        run: uv run pytest --require-database
      - name: Seed synthetic farm and document records for restore verification
        run: >-
          uv run pytest --require-database
          tests/integration/test_farm_api.py::test_weather_reschedule_uses_exact_plan_and_commits_once
      - name: Verify a synthetic PostgreSQL backup and restore
        working-directory: .
        run: docker compose exec -T db sh -s < scripts/database/verify_test_restore.sh
      - name: Check separate worker startup
        run: uv run python -m app.worker --once
      - name: Database failure diagnostics
        if: failure()
        working-directory: .
        run: docker compose logs --tail 100 db
      - name: Stop CI containers
        if: always()
        working-directory: .
        run: docker compose down

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and create disposable configuration
        working-directory: backend
        run: |
          uv sync --locked
          uv run python ../scripts/configure_local.py
      - name: Start PostgreSQL with pgvector
        run: docker compose up -d --wait
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Test account, farm, support, admin and chilli journeys
        working-directory: frontend
        env:
          E2E_BUILT_FRONTEND: '1'
        run: npm run test:e2e -- --reporter=list,github
      - name: Database failure diagnostics
        if: failure()
        run: docker compose logs --tail 100 db
      - name: Stop CI containers
        if: always()
        run: docker compose down
